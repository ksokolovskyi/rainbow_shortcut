name: rainbow_shortcut
description: "Rainbow Shortcut"
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  vector_graphics: ^1.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  vector_graphics_compiler: ^1.1.19
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

    - path: assets/
      transformers:
        - package: vector_graphics_compiler